android.useAndroidX=true

# The 4096m/1024m this used to be set to was too much *headroom per process* on a
# 15GB Windows machine, not too little: with kapt.use.worker.api=true these jvmargs
# are reused for every kapt worker JVM too, and workers.max below was uncapped
# (defaulting to CPU core count - 12 on a 12-core machine). That let Gradle try to
# spin up several 4GB+ JVMs at once across the daemon, the standalone Kotlin daemon,
# and kapt workers for this project's 22 modules, which blew past physical RAM and
# crashed with native OOM (see hs_err_pid*.log - "Native memory allocation failed").
# These smaller, capped values keep every JVM's total footprint (heap + metaspace +
# code cache) predictable so several of them can coexist in 15GB alongside Windows,
# an IDE, and a browser. Raise them if you're on a machine with more free RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Caps how many worker/compiler processes Gradle will run at once. Left at its
# default (= CPU core count, 12 here) this is what let so many 4GB+ JVMs pile up
# simultaneously and exhaust RAM. 2 keeps builds parallel enough to be useful without
# stacking up more heavyweight processes than a 15GB machine can hold at once.
org.gradle.workers.max=2

# Not relying on the default (unset, which falls back to whatever a machine-wide
# ~/.gradle/gradle.properties might set): explicit false so project-level task
# parallelism never multiplies the number of concurrent JVMs on top of the
# workers.max cap above.
org.gradle.parallel=false

# The standalone Kotlin compile daemon is a separate process from the Gradle daemon
# and does NOT inherit org.gradle.jvmargs above - without this it sizes itself
# independently and was one more uncapped heavyweight JVM competing for RAM. Give it
# the same explicit, modest ceiling.
kotlin.daemon.jvm.options=-Xmx1536m,-XX:MaxMetaspaceSize=512m,-XX:ReservedCodeCacheSize=256m

# Reuses the (now capped) daemon JVM args for kapt's own worker processes too.
kapt.use.worker.api=true

org.gradle.caching=true
